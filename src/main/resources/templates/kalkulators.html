<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kalkulators</title>
</head>
<body>
<!-- ceļa (path) parametri un vaicājuma (query) parametri-->
    <form th:action="@{/kalkulators}" method="post">
        <input type="number" name="pirmaisSkaitlis">
        <select id="darbiba" name="darbiba">
            <option value="/">/</option>
            <option value="*">*</option>
            <option value="+">+</option>
            <option value="-">-</option>
        </select>
        <input type="number" name="otraisSkaitlis">
        <button type="submit">=</button>
    </form>

    <!-- Parādīt atbildi no servera -->
    <div th:if="${result != null}">
        <p>Rezultāts</p>
        <h3 th:text="${result}"></h3>
    </div>

</body>
</html>
